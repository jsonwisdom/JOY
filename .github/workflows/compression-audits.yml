name: CompressionAudits — School of Wisdom

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "docs/school-of-wisdom/**"
      - "scripts/compression_audits.py"
      - ".github/workflows/compression-audits.yml"
  pull_request:
    paths:
      - "index.html"
      - "docs/school-of-wisdom/**"
      - "scripts/compression_audits.py"
      - ".github/workflows/compression-audits.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compression-audits-school-of-wisdom
  cancel-in-progress: false

jobs:
  compression-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run CompressionQueries through WikiAtomBombGovernor
        id: audit
        continue-on-error: true
        run: python scripts/compression_audits.py

      - name: Show audit receipt
        run: cat docs/school-of-wisdom/compression-audit.latest.json

      - name: AutoFix bounded generated status block
        if: github.event_name != 'pull_request'
        run: |
          if [ -n "$(git status --porcelain -- index.html docs/school-of-wisdom/compression-audit.latest.json docs/school-of-wisdom/homepage-scaffold.latest.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html docs/school-of-wisdom/compression-audit.latest.json docs/school-of-wisdom/homepage-scaffold.latest.json
            git commit -m "CompressionAudits: refresh School of Wisdom homepage status"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No bounded autofix changes."
          fi

      - name: Enforce no fake green
        if: steps.audit.outcome != 'success'
        run: |
          echo "Compression audit did not pass all scoped checks."
          echo "School remains NOT_PASSED_GLOBAL."
          exit 1

      - name: Verify live E2E HTTP 200
        run: |
          set -euo pipefail
          ROOT_URL="https://jsonwisdom.github.io/JOY/"
          SCHOOL_URL="https://jsonwisdom.github.io/JOY/school-of-wisdom/"

          check_200() {
            url="$1"
            body="$2"
            for attempt in $(seq 1 40); do
              code="$(curl -L -sS -o "$body" -w '%{http_code}' "$url" || true)"
              echo "$url -> HTTP $code (attempt $attempt)"
              if [ "$code" = "200" ]; then
                return 0
              fi
              sleep 5
            done
            echo "HTTP 200 not observed for $url"
            return 1
          }

          check_200 "$ROOT_URL" /tmp/joy-root.html
          check_200 "$SCHOOL_URL" /tmp/school-of-wisdom.html
          grep -Fq "Jaywisdom.eth School of Wisdom" /tmp/school-of-wisdom.html
          echo "E2E_OK=HTTP_200_ROOT+HTTP_200_SCHOOL+SCHOOL_MARKER"
