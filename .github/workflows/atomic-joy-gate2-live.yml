name: Atomic JOY Gate 2 Live Delivery

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read
  actions: read

concurrency:
  group: atomic-joy-gate2-live-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  gate2-live:
    name: single-shot-runtime-discord-proof
    if: github.head_ref == 'atomic-joy/persistent-delivery-v0.0.1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      KNOWN_HEAD: 71e437d2b4c3148033f62236932de3ce2476696b
      KNOWN_RUN_ID: '31176908693'
      KNOWN_ARTIFACT_ID: '8993161146'
      KNOWN_ARTIFACT_DIGEST: sha256:ba0578b39372de5b92b00d6e33a2267bb6f9cba49c28a970402e4db669986cf1

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download exact known-good artifact
        uses: actions/download-artifact@v4
        with:
          name: atomic-joy-runtime-${{ env.KNOWN_HEAD }}
          path: artifacts/input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.KNOWN_RUN_ID }}

      - name: Bind GitHub artifact metadata
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          run_id = os.environ['KNOWN_RUN_ID']
          artifact_id = int(os.environ['KNOWN_ARTIFACT_ID'])
          expected_digest = os.environ['KNOWN_ARTIFACT_DIGEST']
          expected_head = os.environ['KNOWN_HEAD']
          expected_name = f'atomic-joy-runtime-{expected_head}'
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100',
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(req, timeout=15) as response:
              payload = json.load(response)
          matches = [a for a in payload.get('artifacts', []) if a.get('id') == artifact_id and not a.get('expired')]
          if len(matches) != 1:
              raise SystemExit('known artifact not uniquely available')
          artifact = matches[0]
          if artifact.get('name') != expected_name:
              raise SystemExit('known artifact name mismatch')
          if artifact.get('digest') != expected_digest:
              raise SystemExit('known artifact digest mismatch')
          metadata = {
              'head_sha': expected_head,
              'run_id': run_id,
              'artifact_id': str(artifact_id),
              'artifact_name': artifact['name'],
              'artifact_digest': artifact['digest'],
          }
          pathlib.Path('artifacts/input/github_artifact_metadata.json').write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print('GATE2_SOURCE_BINDING_GREEN')
          PY

      - name: Re-run Gate 1 contract tests before live side effect
        shell: bash
        env:
          ATOMIC_JOY_TEST_ARTIFACT_DIR: artifacts/input
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_delivery_contract

      - name: Require delivery secrets before side effect
        shell: bash
        env:
          DISCORD_TOKEN: ${{ secrets.ATOMIC_JOY_DISCORD_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.ATOMIC_JOY_DISCORD_CHANNEL_ID }}
        run: |
          set -euo pipefail
          test -n "$DISCORD_TOKEN"
          test -n "$DISCORD_CHANNEL_ID"
          echo 'GATE2_DELIVERY_SECRETS_PRESENT'

      - name: Execute single live delivery
        shell: bash
        env:
          DISCORD_TOKEN: ${{ secrets.ATOMIC_JOY_DISCORD_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.ATOMIC_JOY_DISCORD_CHANNEL_ID }}
          ATOMIC_JOY_EXPECTED_HEAD: ${{ env.KNOWN_HEAD }}
          ATOMIC_JOY_EXPECTED_RUN_ID: ${{ env.KNOWN_RUN_ID }}
          ATOMIC_JOY_ARTIFACT_ID: ${{ env.KNOWN_ARTIFACT_ID }}
          ATOMIC_JOY_ARTIFACT_DIGEST: ${{ env.KNOWN_ARTIFACT_DIGEST }}
          ATOMIC_JOY_INPUT_DIR: artifacts/input
          ATOMIC_JOY_DELIVERY_DIR: artifacts/atomic_joy/delivery
        run: |
          set -euo pipefail
          python scripts/deliver_discord_receipt.py

      - name: Verify Receipt 2 and intent bindings
        shell: bash
        env:
          DISCORD_CHANNEL_ID: ${{ secrets.ATOMIC_JOY_DISCORD_CHANNEL_ID }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib

          out = pathlib.Path('artifacts/atomic_joy/delivery')
          receipt = json.loads((out / 'delivery_receipt.json').read_text())
          intent = json.loads((out / 'delivery_intent.json').read_text())
          expected_keys = {
              'original_digest', 'delivery_id', 'timestamp',
              'channel_id', 'discord_message_id'
          }
          if set(receipt) != expected_keys:
              raise SystemExit(f'Receipt 2 schema mismatch: {sorted(receipt)}')
          if receipt['original_digest'] != os.environ['KNOWN_ARTIFACT_DIGEST']:
              raise SystemExit('Receipt 2 original digest mismatch')
          if receipt['delivery_id'] != intent.get('delivery_id'):
              raise SystemExit('Receipt 2 delivery_id does not match intent')
          if receipt['channel_id'] != os.environ['DISCORD_CHANNEL_ID']:
              raise SystemExit('Receipt 2 channel_id mismatch')
          if not str(receipt['discord_message_id']).isdigit():
              raise SystemExit('Receipt 2 Discord message id malformed')
          print('GATE2_RECEIPT_BINDINGS_GREEN')
          print('DISCORD_MESSAGE_ID=' + receipt['discord_message_id'])
          print('DELIVERY_ID=' + receipt['delivery_id'])
          PY

      - name: Scan delivery artifacts for Discord token leakage
        shell: bash
        env:
          DISCORD_TOKEN: ${{ secrets.ATOMIC_JOY_DISCORD_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib
          token = os.environ['DISCORD_TOKEN'].encode()
          root = pathlib.Path('artifacts/atomic_joy/delivery')
          for path in root.rglob('*'):
              if path.is_file() and token and token in path.read_bytes():
                  raise SystemExit('Discord token leakage detected in delivery artifact')
          print('GATE2_TOKEN_ARTIFACT_SCAN_GREEN')
          PY

      - name: Upload immutable Gate 2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atomic-joy-gate2-live-${{ github.event.pull_request.head.sha }}
          path: artifacts/atomic_joy/delivery/
          retention-days: 90
          if-no-files-found: warn
