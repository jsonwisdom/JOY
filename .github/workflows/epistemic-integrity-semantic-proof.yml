name: Epistemic Integrity Semantic Proof

on:
  pull_request:
    paths:
      - 'tests/epistemic-fixtures/**'
      - '.github/workflows/epistemic-integrity-semantic-proof.yml'
      - '.github/workflows/epistemic-integrity-gate.yml'
      - 'schema/claim_state.schema.json'
      - 'schema/claim_revocation.schema.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-semantics:
    name: prove-${{ matrix.case }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: active-claim-blocks-deletion
            expected_status: 1
            expected_message: "Referenced by active claim states: CLAIMED"
          - case: revoked-claim-allows-deletion
            expected_status: 0
            expected_message: "Epistemic integrity verified. Constitution upheld."
          - case: in-place-modification-blocked
            expected_status: 1
            expected_message: "In-place modification of claims detected"
          - case: valid-transition-appended
            expected_status: 0
            expected_message: "Epistemic integrity verified. Constitution upheld."

    steps:
      - name: Checkout proof branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned test tooling
        run: python -m pip install jsonschema==4.23.0 PyYAML==6.0.2

      - name: Extract exact production gate body
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml

          workflow = yaml.safe_load(Path('.github/workflows/epistemic-integrity-gate.yml').read_text())
          steps = workflow['jobs']['epistemic-integrity']['steps']
          matches = [step for step in steps if step.get('name') == 'Epistemic Integrity Gate']
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one production gate step; got {len(matches)}')
          script = matches[0].get('run')
          if not isinstance(script, str) or not script.strip():
              raise SystemExit('production gate step has no runnable shell body')

          base_line = 'BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before }}"'
          head_line = 'HEAD_SHA="${{ github.sha }}"'
          if base_line not in script or head_line not in script:
              raise SystemExit('production gate SHA binding lines changed; proof harness refuses silent drift')

          script = script.replace(base_line, "BASE_SHA='HEAD~1'", 1)
          script = script.replace(head_line, "HEAD_SHA='HEAD'", 1)
          out = Path('/tmp/joy-production-epistemic-gate.sh')
          out.write_text(script, encoding='utf-8')
          print('PRODUCTION_GATE_BODY_EXTRACTED')
          PY
          echo 'PRODUCTION_GATE_SCRIPT=/tmp/joy-production-epistemic-gate.sh' >> "$GITHUB_ENV"

      - name: Build isolated fixture history
        shell: bash
        env:
          CASE: ${{ matrix.case }}
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          WORK="$RUNNER_TEMP/epistemic-$CASE"
          rm -rf "$WORK"
          mkdir -p "$WORK/schema" "$WORK/claims" "$WORK/evidence" "$WORK/revocations"
          cp "$ROOT/schema/claim_state.schema.json" "$WORK/schema/"
          cp "$ROOT/schema/claim_revocation.schema.json" "$WORK/schema/"
          cd "$WORK"
          git init -q
          git config user.name 'JOY Epistemic Fixture'
          git config user.email 'fixture@example.invalid'

          case "$CASE" in
            active-claim-blocks-deletion)
              cp "$ROOT/tests/epistemic-fixtures/$CASE/claims/obs-001.json" claims/
              cp "$ROOT/tests/epistemic-fixtures/$CASE/evidence/"* evidence/
              git add . && git commit -qm 'fixture: active baseline'
              rm evidence/sha256-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
              git add -A && git commit -qm 'fixture: attempt active evidence deletion'
              ;;
            revoked-claim-allows-deletion)
              cp "$ROOT/tests/epistemic-fixtures/$CASE/claims/obs-002.json" claims/
              cp "$ROOT/tests/epistemic-fixtures/$CASE/evidence/"* evidence/
              git add . && git commit -qm 'fixture: revoked baseline'
              rm evidence/sha256-bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
              git add -A && git commit -qm 'fixture: archive revoked evidence'
              ;;
            in-place-modification-blocked)
              cp "$ROOT/tests/epistemic-fixtures/$CASE/claims/obs-003.json" claims/
              git add . && git commit -qm 'fixture: immutable claim baseline'
              python - <<'PY'
          import json
          from pathlib import Path
          p = Path('claims/obs-003.json')
          obj = json.loads(p.read_text())
          obj['state'] = 'PROVEN'
          p.write_text(json.dumps(obj, indent=2) + '\n')
          PY
              git add -A && git commit -qm 'fixture: illegal in-place modification'
              ;;
            valid-transition-appended)
              cp "$ROOT/tests/epistemic-fixtures/$CASE/claims/obs-004.json" claims/
              git add . && git commit -qm 'fixture: claimed baseline'
              cp "$ROOT/tests/epistemic-fixtures/$CASE/claims/obs-004.proven.json" claims/
              cp "$ROOT/tests/epistemic-fixtures/$CASE/evidence/"* evidence/
              git add -A && git commit -qm 'fixture: append proven transition'
              ;;
            *)
              echo "unknown fixture case: $CASE" >&2
              exit 2
              ;;
          esac

          echo "FIXTURE_WORK=$WORK" >> "$GITHUB_ENV"

      - name: Execute actual production gate body
        id: gate
        shell: bash
        env:
          EXPECTED_STATUS: ${{ matrix.expected_status }}
          EXPECTED_MESSAGE: ${{ matrix.expected_message }}
        run: |
          set -euo pipefail
          cd "$FIXTURE_WORK"

          set +e
          bash "$PRODUCTION_GATE_SCRIPT" >gate-output.txt 2>&1
          STATUS=$?
          set -e

          cat gate-output.txt
          echo "observed_status=$STATUS" >> "$GITHUB_OUTPUT"

          if [ "$STATUS" -ne "$EXPECTED_STATUS" ]; then
            echo "::error::Wrong gate exit code. Expected $EXPECTED_STATUS, observed $STATUS"
            exit 1
          fi
          if ! grep -Fq "$EXPECTED_MESSAGE" gate-output.txt; then
            echo "::error::Expected constitutional diagnostic not found: $EXPECTED_MESSAGE"
            exit 1
          fi

          echo "SEMANTIC_CASE_PASS=${{ matrix.case }}"

      - name: Assert four-state interpretation
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.case }}' in
            active-claim-blocks-deletion)
              test '${{ steps.gate.outputs.observed_status }}' = '1'
              echo 'EXPECTED_RED_CONFIRMED: active claim protects evidence'
              ;;
            revoked-claim-allows-deletion)
              test '${{ steps.gate.outputs.observed_status }}' = '0'
              echo 'EXPECTED_GREEN_CONFIRMED: revoked claim releases evidence'
              ;;
            in-place-modification-blocked)
              test '${{ steps.gate.outputs.observed_status }}' = '1'
              echo 'EXPECTED_RED_CONFIRMED: claims are immutable'
              ;;
            valid-transition-appended)
              test '${{ steps.gate.outputs.observed_status }}' = '0'
              echo 'EXPECTED_GREEN_CONFIRMED: transitions are append-only'
              ;;
          esac
