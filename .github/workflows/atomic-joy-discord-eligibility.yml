name: Atomic JOY Discord Eligibility

on:
  workflow_run:
    workflows: ["Atomic JOY Verify"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: atomic-joy-discord-eligibility-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  discord-eligibility:
    name: discord-eligibility
    if: github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout verified HEAD (full history)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned verifier deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r bot/requirements.txt

      - name: Run fail-closed Discord eligibility gate
        id: eligibility
        shell: bash
        env:
          ATOMIC_JOY_GITHUB_TOKEN: ${{ github.token }}
          ATOMIC_JOY_EXPECTED_HEAD: ${{ github.event.workflow_run.head_sha }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -uo pipefail
          mkdir -p artifacts/atomic_joy/discord_eligibility

          set +e
          python scripts/verify_discord_eligibility.py \
            > artifacts/atomic_joy/discord_eligibility/eligibility_receipt.json \
            2> artifacts/atomic_joy/discord_eligibility/eligibility_stderr.txt
          code=$?
          set -e

          echo "$code" > artifacts/atomic_joy/discord_eligibility/exit_code.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

          RECEIPT_SHA=$(sha256sum artifacts/atomic_joy/discord_eligibility/eligibility_receipt.json | awk '{print $1}')
          HEAD_SHA=$(git rev-parse HEAD)
          export RECEIPT_SHA HEAD_SHA code

          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          manifest = {
              "protocol": "ATOMIC_JOY_DISCORD_ELIGIBILITY_RECEIPT",
              "version": "0.0.1",
              "head_sha": os.environ["HEAD_SHA"],
              "upstream_atomic_joy_verify_run_id": os.environ["UPSTREAM_RUN_ID"],
              "eligibility_run_id": os.environ.get("GITHUB_RUN_ID"),
              "eligibility_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", "1"),
              "eligibility_receipt_sha256": os.environ["RECEIPT_SHA"],
              "exit_code": int(os.environ["code"]),
              "human_observation_required": True,
              "end_to_end_discord_confirmed": False,
              "sealed_bytes_touched": False,
              "no_fake_green": True,
              "timestamp_utc": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }

          with open(
              "artifacts/atomic_joy/discord_eligibility/receipt_manifest.json",
              "w",
              encoding="utf-8",
          ) as f:
              json.dump(manifest, f, indent=2, sort_keys=True)
              f.write("\n")
          PY

          cat artifacts/atomic_joy/discord_eligibility/eligibility_receipt.json
          if [ "$code" -ne 0 ]; then
            echo "ATOMIC_JOY_DISCORD_ELIGIBILITY_FAILED exit_code=$code"
            cat artifacts/atomic_joy/discord_eligibility/eligibility_stderr.txt || true
            exit "$code"
          fi

          echo "ATOMIC_JOY_DISCORD_ELIGIBILITY_CONFIRMED"

      - name: Upload Discord eligibility receipt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atomic-joy-discord-eligibility-${{ github.event.workflow_run.head_sha }}
          path: artifacts/atomic_joy/discord_eligibility/
          retention-days: 90
          if-no-files-found: error
