name: docs-daily

on:
  workflow_run:
    workflows: ["Atomic JOY Verify"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: joy-docs-daily
  cancel-in-progress: false

env:
  JOY_AUTHORITY: 'false'
  JOY_FAKE_GREEN: 'forbidden'
  JOY_OPERATOR: 'HEIDEE'
  JOY_LANGUAGE_LAYER: 'MRS_WISDOM_APPROVED_JOYSPACE'

jobs:
  build-docs:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout verified HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare directories
        run: |
          mkdir -p docs
          mkdir -p scripts
          mkdir -p voice

      - name: Enforce JOY doctrine via HEIDEE ingestion
        run: |
          set -euo pipefail
          if [ ! -f scripts/joy_build_docs.py ]; then
            echo 'Missing scripts/joy_build_docs.py'
            exit 1
          fi
          python scripts/joy_build_docs.py

      - name: Enforce JOY doctrine via Mrs Wisdom render
        run: |
          set -euo pipefail
          if [ ! -f scripts/render_joy_pages.py ]; then
            echo 'Missing scripts/render_joy_pages.py'
            exit 1
          fi
          python scripts/render_joy_pages.py

      - name: Reject changes outside /docs
        run: |
          set -euo pipefail
          outside_docs="$(git status --porcelain --untracked-files=all | grep -vE '^.. docs(/|$)' || true)"
          if [ -n "$outside_docs" ]; then
            echo 'Refusing generated changes outside docs/**:'
            printf '%s\n' "$outside_docs"
            exit 1
          fi

      - name: Detect /docs changes
        id: docs_changes
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- docs)" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and fast-forward /docs updates
        if: steps.docs_changes.outputs.changed == 'true'
        env:
          VERIFIED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if [ "$(git rev-parse origin/main)" != "$VERIFIED_HEAD_SHA" ]; then
            echo 'Refusing stale write: main moved after Atomic JOY Verify.'
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs

          if git diff --cached --name-only | grep -vE '^docs(/|$)'; then
            echo 'Refusing staged path outside docs/**.'
            exit 1
          fi

          git commit -m "Regenerate JOY /docs after Atomic JOY Verify GREEN; authority:false preserved; fake_green:forbidden preserved."
          git push origin HEAD:main

      - name: No-op when /docs unchanged
        if: steps.docs_changes.outputs.changed != 'true'
        run: echo 'No /docs changes detected; nothing to commit.'
